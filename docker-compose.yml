services:
  api:
    build: .
    ports:
      - "3300:3300"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/memoria
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - PORT=3300
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongo
    volumes:
      - .:/app
      - /app/node_modules

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
