services:
  api:
    build: .
    ports:
      - "3300:3300"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/memoria
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PORT=3300
    depends_on:
      - mongo
    volumes:
      - .:/app
      - /app/node_modules

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
