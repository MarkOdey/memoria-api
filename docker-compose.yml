services:
  api:
    build: .
    ports:
      - "3300:3300"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/memoria
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - PORT=3300
    depends_on:
      - mongo
      - ollama
    volumes:
      - .:/app

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mongo_data:
  ollama_data:
